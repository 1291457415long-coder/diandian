plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diandian.glucose'
    compileSdk 34

    defaultConfig {
        applicationId "com.diandian.glucose"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Debug 包可调试、可直接安装
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    // 仅需 androidx.core（WindowCompat/ViewCompat/FileProvider）+ androidx.webkit（WebViewAssetLoader）
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
    // 统一 kotlin-stdlib 版本，避免传递依赖冲突
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:1.8.22') { because '统一 stdlib 版本' }
    }
}
